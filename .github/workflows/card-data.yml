name: Card data snapshot
# Saves the card data the app uses (Scryfall cards, sets, bracket tags, EDHREC commander pages) to the card-data
# branch, so recommendation changes can be tested against real cards. It never touches main or the live site.
# Runs every day at 4:00 a.m. New York time: cards and prices only (prices.json.gz, read by the Deck Builder), and
# everything (EDHREC pages, combos, tags) on Mondays. GitHub's schedule is in UTC only, so it is set for both 08:00 UTC
# (4 a.m. EDT) and 09:00 UTC (4 a.m. EST) and the "When" step keeps the one that is 4 a.m. in New York that day.
# Minute 17, not 0 (7 Nov 2026): GitHub started the on-the-hour runs 7 to 8 hours late (about 11:30 a.m. New York).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/card-data.yml', 'tools/fetch-card-data.mjs', 'tools/build-combos.mjs', 'tools/commanders.txt']
permissions:
  contents: write
concurrency:
  group: card-data
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: When
        id: when
        run: |
          off=$(TZ=America/New_York date +%z); dow=$(TZ=America/New_York date +%u)
          go=yes
          if [ "${{ github.event_name }}" = schedule ]; then
            # -0400 (EDT): the 08:00 UTC run is 4 a.m.; -0500 (EST): the 09:00 UTC run is. A late start still counts.
            want='17 8 * * *'; [ "$off" = "-0500" ] && want='17 9 * * *'
            [ "${{ github.event.schedule }}" = "$want" ] || go=no
          fi
          mode=prices; { [ "$dow" = 1 ] || [ "${{ github.event_name }}" != schedule ]; } && mode=full
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "New York offset $off, weekday $dow: run=$go, mode=$mode"
      - if: steps.when.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.when.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start from the previous snapshot
        if: steps.when.outputs.go == 'yes'
        run: git clone --depth 1 -b card-data "https://github.com/${{ github.repository }}.git" out && rm -rf out/.git || mkdir -p out
      - if: steps.when.outputs.go == 'yes'
        run: node tools/fetch-card-data.mjs
        env:
          MODE: ${{ steps.when.outputs.mode }}
      - name: Publish to the card-data branch
        if: steps.when.outputs.go == 'yes'
        run: |
          cd out
          git init -q -b card-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Card data snapshot $(date -u +%F) (${{ steps.when.outputs.mode }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" card-data
